<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN | CADASTRO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="assets/img/favicon.ico" type="image/x-icon">
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen">

    <!-- Container Cadastro -->
    <div class="w-full max-w-md bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-2xl">
        
        <!-- Título -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white uppercase">
                Criar Conta <span class="text-amber-500">Admin</span>
            </h1>
            <p class="text-slate-400 text-sm mt-2">Cadastre-se para acessar o painel</p>
        </div>

        <!-- Form Cadastro -->
        <form class="space-y-5">

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">
                    Nome Completo
                </label>
                <input 
                    type="text" 
                    required 
                    placeholder="Seu nome"
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white outline-none focus:ring-2 focus:ring-amber-500"
                >
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">
                    E-mail
                </label>
                <input 
                    type="email" 
                    required 
                    placeholder="seuemail@email.com"
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white outline-none focus:ring-2 focus:ring-amber-500"
                >
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">
                    Telefone
                </label>
                <input 
                    type="tel" 
                    required 
                    placeholder="(00) 00000-0000"
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white outline-none focus:ring-2 focus:ring-amber-500"
                >
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">
                    Especialidade
                </label>
                <select 
                    required
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white outline-none focus:ring-2 focus:ring-amber-500"
                >
                    <option value="">Selecione...</option>
                    <option>Cortes Modernos (Fade)</option>
                    <option>Barba e Toalha Quente</option>
                    <option>Cortes Clássicos</option>
                    <option>Colorimetria</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-1">
                    Senha
                </label>
                <input 
                    type="password" 
                    required 
                    placeholder="********"
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white outline-none focus:ring-2 focus:ring-amber-500"
                >
            </div>

            <!-- Botão -->
            <button 
                type="submit"
                class="w-full bg-amber-600 hover:bg-amber-700 py-4 rounded-lg font-bold uppercase tracking-widest transition-all"
            >
                Criar Conta
            </button>

        </form>

    </div>

</body>
</html>
