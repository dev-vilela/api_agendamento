<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADMIN | LOGIN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="assets/img/favicon.ico" type="image/x-icon">
</head>
<body class="bg-slate-950 flex items-center justify-center min-h-screen">

    <!-- Container Login -->
    <div class="w-full max-w-md bg-slate-900 p-8 rounded-2xl border border-slate-800 shadow-2xl">
        
        <!-- Título -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white uppercase">
                Painel <span class="text-amber-500">Admin</span>
            </h1>
            <p class="text-slate-400 text-sm mt-2">Acesse sua conta</p>
        </div>

        <!-- Form Login -->
        <form class="space-y-6">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">
                    E-mail
                </label>
                <input 
                    type="email" 
                    required 
                    placeholder="seuemail@email.com"
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-amber-500 outline-none"
                >
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">
                    Senha
                </label>
                <input 
                    type="password" 
                    required 
                    placeholder="********"
                    class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:ring-2 focus:ring-amber-500 outline-none"
                >
            </div>

            <!-- Botão -->
            <button 
                type="submit"
                class="w-full bg-amber-600 hover:bg-amber-700 py-4 rounded-lg font-bold uppercase tracking-widest transition-all"
            >
                Entrar no Painel
            </button>

            <hr>
           <a href="register.html" 
            class="w-full block text-center mt-4 bg-slate-800 hover:bg-slate-700 text-white py-3 rounded-lg font-bold uppercase tracking-widest transition-all border border-slate-700">
                Criar Conta
           </a>
        </form>

    </div>

</body>
</html>
